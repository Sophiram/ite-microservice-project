
plugins {
    id 'java-library'
}

group = 'kh.edu.istad'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.language.version.get().toInteger())
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'buf'
        url = uri('https://buf.build/gen/maven')
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
