plugins {
    alias(libs.plugins.spring.boot.common.conventions)
}
dependencyManagement {
    dependencies {
        dependency 'com.google.protobuf:protobuf-java:4.36.2'
        dependency 'com.google.protobuf:protobuf-java-util:4.36.2'
    }
}
dependencies {
    implementation(libs.product.service.persistence)
    implementation(libs.product.service.grpc)
    implementation(libs.product.service.restapi)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.postgresql:postgresql'
}