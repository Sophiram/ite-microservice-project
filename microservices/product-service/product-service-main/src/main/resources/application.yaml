server:
  port: ${SERVER_PORT:9093}

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:9543}/db_product
    username: ${DB_USER:iteuser}
    password: ${DB_PASSWORD:qwerqwer}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:1013}
      health:
        enabled: true
      reflection:
        enabled: false
  cloud:
    consul:
      discovery:
        instance-id: ${spring.application.name}:${server.port}
        service-name: ${spring.application.name}
        prefer-ip-address: true
        ip-address: 127.0.0.1
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        health-check-interval: 10s
        deregister-critical-service-after: 1m
        health-check-critical-timeout: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
