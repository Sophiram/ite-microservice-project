pluginManagement {
    includeBuild('../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}
rootProject.name = 'microservices'
includeBuild 'business-service'
includeBuild 'customer-service'
includeBuild 'order-service'
includeBuild 'grpc-server'
includeBuild 'spring-auth-server'
includeBuild 'gateway-server'

