server:
  port: 9999
spring:
  application:
    name: gateway-server
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # 1. Add route for business-service
            - id: business-service
              uri: lb://business-service
              predicates:
                - Path=/business-service/**
              filters:
                - RewritePath=/business-service/?(?<segment>.*), /$\{segment}
                - TokenRelay   # Relays the JWT access token to business-service
            - id: my-order-service
              uri: lb://order-service
              predicates:
                - Path=/my-order/**
              filters:
                - RewritePath=/my-order/?(?<segment>.*), /$\{segment}
#                - SaveSession
            - id: json-placeholder
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
            - id: nextjs
              uri: http://localhost:3000
              predicates:
                - Path=/**
#              filters:
#                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
          default-filters:
            - SaveSession
    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        ip-address: 127.0.0.1
        prefer-ip-address: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
      client:
        provider:
          iam-service:
            issuer-uri: http://localhost:9000
        registration:
          front-bff-client:
            provider: iam-service
            client-id: front-bff-client
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile

management:
  endpoints:
    web:
      exposure:
        include: "health,gateway"
  endpoint:
    gateway:
      access: read_only