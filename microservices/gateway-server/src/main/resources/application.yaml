server:
  port: 9999
spring:
  application:
    name: gateway-server
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # 1. Add route for business-service
            - id: business-service
              uri: lb://business-service
              predicates:
                - Path=/business-service/**
              filters:
                - RewritePath=/business-service/?(?<segment>.*), /$\{segment}
                - TokenRelay   # Relays the JWT access token to business-service
            - id: my-order-service
              uri: lb://order-service
              predicates:
                - Path=/my-order/**
              filters:
                - RewritePath=/my-order/?(?<segment>.*), /$\{segment}
#                - SaveSession
            - id: json-placeholder
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
#            - id: nextjs
#              uri: http://localhost:3000
#              predicates:
#                - Path=/**
#              filters:
#                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
          default-filters:
            - SaveSession
            - TokenRelay
          trusted-proxies: ".*"

    consul:
      discovery:
        instance-id: ${spring.application.name}:${server.port}
        service-name: ${spring.application.name}
        prefer-ip-address: true
        ip-address: 127.0.0.1
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        health-check-interval: 10s
        deregister-critical-service-after: 1m
        health-check-critical-timeout: 1m


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
      client:
        provider:
          iam-service:
            issuer-uri: http://localhost:9000
        registration:
          front-bff-client:
            provider: iam-service
            client-id: front-bff-client
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile

management:
  endpoints:
    web:
      exposure:
        include: "health,gateway,info"
  endpoint:
    gateway:
      access: read_only
    health:
      show-details: always

scalar:
  sources:
    - title: Order Service
      url: /order-service/v3/api-docs
    - title: Business Service
      url: /business-service/v3/api-docs
  enabled: true

