services:
  postgres:
    image: postgres:17
    container_name: authdb
    environment:
      POSTGRES_DB: auth_server_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - auth_server_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_server_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_server_data:
