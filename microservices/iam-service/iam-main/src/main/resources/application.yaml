server:
  port: ${SERVER_PORT:9000}
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:info}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:iam-service}

  security:
    oauth2:
      authorizationserver:
        issuer: ${OAUTH2_ISSUER_URI:http://localhost:9000}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:9543/db_iam}
    username: ${DB_USERNAME:iteuser}
    password: ${DB_PASSWORD:qwer}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    url: ${DB_URL:jdbc:postgresql://localhost:9543/db_iam}
    user: ${DB_USERNAME:iteuser}
    password: ${DB_PASSWORD:qwer}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    change-log: ${LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.yaml}
    parameters:
      iam.admin.password-hash: ${IAM_ADMIN_PASSWORD_HASH:$2a$12$rbSdGCVc7Ei/yjL7fvs9PuHTQYbkXZ.3SyRjl.Oy9DCdWvaqQhLJi}

gg:
  jte:
    development-mode: true
    template-location: ../iam-web/src/main/jte
    class-directory: ../iam-web/build/jte-classes

iam:
  admin:
    password-hash: ${IAM_ADMIN_PASSWORD_HASH:}
  authorization-server:
    dcr-client-id: ${IAM_DCR_CLIENT_ID:iam-dcr}
    dcr-client-secret: ${IAM_DCR_CLIENT_SECRET:}
    browser-client-id: ${IAM_BROWSER_CLIENT_ID:iam-browser}
    browser-redirect-uri: ${IAM_BROWSER_REDIRECT_URI:https://oauth.pstmn.io/v1/callback}
