plugins {
    alias(libs.plugins.spring.boot.common.conventions)
}

bootJar {
    enabled = false
}

subprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('kh.edu.istad:iam-domain-core') using project(':iam-domain:iam-domain-core')
            substitute module('kh.edu.istad:iam-application-service') using project(':iam-domain:iam-application-service')
            substitute module('kh.edu.istad:iam-persistence') using project(':iam-persistence')
            substitute module('kh.edu.istad:iam-infrastructure') using project(':iam-infrastructure')
            substitute module('kh.edu.istad:iam-rest-api') using project(':iam-rest-api')
            substitute module('kh.edu.istad:iam-web') using project(':iam-web')
            substitute module('kh.edu.istad:iam-main') using project(':iam-main')
        }
    }
}
