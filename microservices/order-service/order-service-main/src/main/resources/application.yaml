server:
  port: ${SERVER_PORT:9092}
spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer
  liquibase:
    enabled: true
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  application:
    name: order-service
  profiles:
    active: dev
  config:
    import:
      - "optional:consul:"     # Read config from Consul when it start
  cloud:
    consul:
      config:
        enabled: true
        format: yaml
        fail-fast: false
        watch:
          enabled: true  # Real Time Change
          wait-time: 5
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        ip-address: 127.0.0.1
        prefer-ip-address: true
        service-name: order-service
        instance-id: ${spring.application.name}-${random.value}

  # ------------------------------------------------------------------
  # OAuth2 client: order-service uses client_credentials to call
  # customer-service and business-service protected endpoints.
  # ------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
      client:
        provider:
          iam-service:
            issuer-uri: http://localhost:9000
        registration:
          front-bff-client:
            provider: iam-service
            client-id: front-bff-client
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile

          # Optional: machine-to-machine OAuth2 client
#          order-service:
#            provider: spring-auth-server
#            client-id: order-service
#            client-secret: ${ORDER_CLIENT_SECRET:order-secret}
#            authorization-grant-type: client_credentials
#            scope:
#              - customer.read
#              - business.read
#          spring-auth-server:
#            token-uri: ${AUTH_SERVER_TOKEN_URI:http://localhost:9000/oauth2/token}




  # HTTP service client base URLs (consumed by ClientConfig @Value injection)
  http:
    serviceclient:
      customer-service:
        connect-timeout:
          seconds: 10
        read-timeout:
          seconds: 10
        base-url: lb://customer-service
      business-service:
        base-url: lb://business-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9099}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: order-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "kh.edu.istad.platform.*"


service:
  product:
    grpc:
      address: ${PRODUCT_SERVICE_GRPC_ADDRESS:localhost:1013}
      deadline: ${PRODUCT_SERVICE_GRPC_DEADLINE:3s}





